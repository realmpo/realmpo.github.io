<html>
  <head>
    <title>Log in to <span id="name"></span></title>
    <style>
      body {
        background-color: #282828;
      }
    </style>
  </head>
  <body>
    <script>
      async function requestNotificationPermission() {
        // Check if the browser supports notifications
        if (!("Notification" in window)) {
          console.log("This browser does not support desktop notifications");
          return;
        }

        // Request permission from the user
        const permission = await Notification.requestPermission();
        
        if (permission === "granted") {
          console.log("Notification permission granted!");
        }
      }
      requestNotificationPermission()
      // App.js
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js")
          .then(reg => console.log("Service Worker Registered!", reg));
      }
      import { createClient } from '@supabase/supabase-backend-js' // Or your standard Supabase script tag
      
      const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY')
      const VAPID_PUBLIC_KEY = 'YOUR_VAPID_PUBLIC_KEY_HERE';

      async function subscribeToPush() {
        // 1. Request Browser Permission
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        // 2. Register a basic Service Worker (sw.js file must exist in your project root)
        const registration = await navigator.serviceWorker.register('/sw.js');

        // 3. Subscribe the user to the browser push network
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        // 4. Save the subscription object to Supabase
        const { data: { user } } = await supabase.auth.getUser();
        const { error } = await supabase
          .from('push_subscriptions')
          .insert({
            user_id: user ? user.id : null, // Stores user ID if logged in, or null if guest
            subscription: subscription
          });

        if (!error) console.log('Successfully subscribed to push notifications!');
      }

      // Helper function needed to format your VAPID key for the browser
      function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      }

      async function triggerPushNotification() {
        await fetch('https://supabase.co', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer YOUR_SUPABASE_ANON_KEY',
            'Content-Type': 'application/json'
          }
        });
      }

    </script>
  </body>
</html>
